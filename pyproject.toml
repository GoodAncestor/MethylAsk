[project]
name = "methylask"
version = "0.0.1"
description = "Methylation/epigenomic marker interpretation — clinical and popular-interest reporting"
requires-python = ">=3.10"
dependencies = [
    # GoodAncestor/bio-core — shared provider/report/fetch mechanism (private repo).
    # git-source spec so a clean install resolves from GitHub, not a same-named PyPI package.
    # Private-repo access uses the installer's git credentials; see README "Install".
    "biocore @ git+https://github.com/GoodAncestor/bio-core.git",
]

[project.optional-dependencies]
parse = ["pandas", "methylprep"]   # raw IDAT normalization, large-matrix handling
web = ["fastapi", "uvicorn"]
report = ["jinja2", "weasyprint"]  # HTML -> PDF

[project.scripts]
methylask = "methylask.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["methylask*"]

[tool.setuptools.package-data]
"methylask" = ["data/reference/manifests/*.tsv.gz",
               "data/reference/clocks/*.csv",
               "data/reference/*.json"]
